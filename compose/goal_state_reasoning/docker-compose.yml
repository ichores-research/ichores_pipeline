version: '2.4'
services:
  yolo:
    image: yolo
    privileged: true
    build:
      context: ../../src/yolov8_ros/docker
      dockerfile: dockerfile_ros
    network_mode: "host"
    runtime: "nvidia"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - "../../src/yolov8_ros:/root/yolo:rw"
      - "../../data/weights/yolov8:/root/yolo/weights:rw"
      - ../../config:/root/config
    environment: 
      - ROS_MASTER_URI=${ROS_MASTER_URI:-http://127.0.0.1:11311}
      - ROS_IP=${ROS_IP:-127.0.0.1}
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - DATASET=${DATASET}
    command: bash -c "source catkin_ws/devel/setup.bash;
                      python ./yolo/detect_ros_seg_service.py --conf-thres 0.85 --weights ./yolo/weights/${DATASET}.pt --camera-topic '$$(rosparam get /pose_estimator/color_topic)'"
    stdin_open: true
    tty: true 

  gdrnpp:
    image: gdrnpp
    build:
      context: ../../src/gdrnpp_bop2022/docker
      dockerfile: dockerfile_ros
    network_mode: "host"
    runtime: "nvidia"
    volumes:
      - "../../src/gdrnpp_bop2022:/root/gdrnpp:rw"
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - "../../data/weights/gdrnpp:/root/gdrnpp/output:rw"
      - "../../data/datasets:/root/gdrnpp/datasets/BOP_DATASETS:rw"
      - ../../config:/root/config
    environment: 
      - ROS_MASTER_URI=${ROS_MASTER_URI:-http://127.0.0.1:11311}
      - ROS_IP=${ROS_IP:-127.0.0.1}
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - DATASET=${DATASET}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CUDA_VISIBLE_DEVICES=0,1
    command: bash -c "source catkin_ws/devel/setup.bash;
             python ./gdrnpp/core/gdrn_modeling/demo/demo_gdrn_ros.py --dataset_name ${DATASET}"        
    stdin_open: true
    tty: true
  task:
    image: task
    privileged: true
    build: 
      context: ../../
      dockerfile: src/task/dockerfile
    network_mode: "host"
    runtime: "nvidia"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../src/task:/root/task
      - ../../config:/root/config
      - "../../data/datasets:/root/task/datasets:rw"
    environment:
      - ROS_MASTER_URI=${ROS_MASTER_URI:-http://127.0.0.1:11311}
      - ROS_IP=${ROS_IP:-127.0.0.1}
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - DATASET=${DATASET}
    command: bash -c "source catkin_ws/devel/setup.bash;
                      rosparam load /root/config/${CONFIG} /pose_estimator;
                      python /root/task/test_obj_det_dev.py"
    stdin_open: true
    tty: true
    depends_on:
      - yolo
      - gdrnpp
  table_plane_extractor:
    image: table_plane_extractor
    privileged: true
    build: 
      context: ../../src/table_plane_extractor/
      dockerfile: Dockerfile
    network_mode: "host"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../config:/root/config
    environment:
      - ROS_MASTER_URI=${ROS_MASTER_URI:-http://127.0.0.1:11311}
      - ROS_IP=${ROS_IP:-127.0.0.1}
      - DISPLAY
      - QT_X11_NO_MITSHM=1
  motion:
    image: motion
    privileged: true
    build: 
      context: ../../src/motion
      dockerfile: Dockerfile
    network_mode: "host"
    runtime: "nvidia"
    volumes:
      - "../../src/motion:/root/motion:rw"
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
    environment: 
      - ROS_MASTER_URI=${ROS_MASTER_URI:-http://127.0.0.1:11311}
      - ROS_IP=${ROS_IP:-127.0.0.1}
      - DISPLAY
      - QT_X11_NO_MITSHM=1
    stdin_open: true
    tty: true
    command: [ "bash", "-c", "source /opt/ros/noetic/setup.bash && source /tiago_public_ws/devel/setup.bash && source /root/catkin_ws/devel/setup.bash && python3 /root/motion/motion_service.py" ]
    depends_on:
      - table_plane_extractor

  goal_state_reasoning:
    image: goal_state_reasoning:${MODEL_HOST:-ollama}
    privileged: true
    build: 
      context: ../../src/goal_state_reasoning/docker
      dockerfile: dockerfile_ros_${MODEL_HOST:-ollama}
    network_mode: "host"
    runtime: "nvidia"
    volumes:
      - ./.ollama/models:/root/.ollama/models:rw
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../src/goal_state_reasoning/src:/root/goal_state_reasoning
      - ../../src/goal_state_reasoning/goal_state_reasoning_msgs:/root/catkin_ws/src/goal_state_reasoning_msgs
      - ../../src/goal_state_reasoning/config:/root/config
      - "../../data/datasets:/root/goal_state_reasoning/datasets:rw"
    environment:
      - ROS_MASTER_URI=${ROS_MASTER_URI:-http://127.0.0.1:11311}
      - ROS_IP=${ROS_IP:-127.0.0.1}
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - DATASET=${DATASET}
      - CONFIG=${CONFIG}
      - TEST_RUN=${TEST_RUN:-FALSE}
    ports:
      - "11434:11434"
    stdin_open: true
    tty: true
    depends_on:
      - yolo
      - gdrnpp
