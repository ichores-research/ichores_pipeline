version: '2.4'
services:
  motion:
    image: motion
    build:
      context: ../../src/motion
      dockerfile: Dockerfile
    network_mode: "host"
    gpus: all
    volumes:
      - "../../src/motion:/root/motion:rw"
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
    environment: 
      - ROS_MASTER_URI=${ROS_MASTER_URI:-http://127.0.0.1:11311}
      - ROS_IP=${ROS_IP:-127.0.0.1}
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - MOVE_GROUP=${MOVE_GROUP}
    command: bash -c "source /opt/ros/noetic/setup.bash;
             source /root/catkin_ws/devel/setup.bash;
             python3 ./motion/motion_service.py --group-name ${MOVE_GROUP}"        
    stdin_open: true
    tty: true

  table_plane_extractor:
    image: table_plane_extractor
    build:
      context: ../../src/table_plane_extractor
      dockerfile: Dockerfile
    network_mode: "host"
    gpus: all
    volumes:
      - "../../src/table_plane_extractor:/root/table_plane_extractor:rw"
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ROS_MASTER_URI=${ROS_MASTER_URI:-http://127.0.0.1:11311}
      - ROS_IP=${ROS_IP:-127.0.0.1}
      - DISPLAY
      - QT_X11_NO_MITSHM=1
    command: bash -c "source /opt/ros/noetic/setup.bash;
             source /root/catkin_ws/devel/setup.bash;
             roslaunch table_plane_extractor table_plane_extractor.launch"
    stdin_open: true
    tty: true
